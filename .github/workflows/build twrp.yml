name: Build TWRP for BLU G0771

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Check Disk Space (after cleanup)
        run: df -h

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Check Disk Space (before sync)
        run: df -h

      - name: Initialize Minimal Manifest
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync
          mkdir -p device/blu
          cp -r "$GITHUB_WORKSPACE/device-tree" device/blu/G0771

      - name: Check Disk Space (after sync)
        run: df -h

      - name: Compile Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_G0771-eng
          mka -j2 bootimage

      - name: Check Disk Space (after build)
        if: always()
        run: df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-blu-G0771
          path: |
            workspace/out/target/product/G0771/boot.img
          if-no-files-found: warn
          
