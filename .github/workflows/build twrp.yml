name: Build TWRP for BLU G0771

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /etc/mysql /etc/php /etc/apt/sources.list.d
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Check Disk Space (before sync)
        run: df -h

      - name: Initialize Minimal Manifest & Sync
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          mkdir -p device/blu
          cp -r "$GITHUB_WORKSPACE/device-tree" device/blu/G0771

      - name: Check Disk Space (after sync)
        run: df -h

      - name: Compile Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_G0771-eng
          mka recoveryimage

      - name: Check Disk Space (after build)
        if: always()
        run: df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-blu-G0771
          path: workspace/out/target/product/G0771/recovery.img
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Check Disk Space (before sync)
        run: df -h

      - name: Initialize Minimal Manifest & Sync
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          mkdir -p device/blu
          cp -r "$GITHUB_WORKSPACE/device-tree" device/blu/G0771

      - name: Check Disk Space (after sync)
        run: df -h

      - name: Compile Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_G0771-eng
          mka recoveryimage

      - name: Check Disk Space (after build)
        if: always()
        run: df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-blu-G0771
          path: workspace/out/target/product/G0771/recovery.img
