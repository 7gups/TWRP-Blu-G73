name: Build TWRP for BLU G0771

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          # root-reserve-mb is the ceiling root keeps -- everything above
          # it gets carved out immediately (non-sparse) into the buildlv
          # image. 2048 left root with only ~100MB free after this step,
          # which is too tight for the apt-get install that follows.
          # Raised to give root real breathing room; buildlv shrinks a
          # bit in exchange, which --depth=1 on repo sync should offset.
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-android: 'true'
          remove-large-packages: 'true'

      - name: Check Disk Space (after cleanup)
        run: df -h

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod +x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Check Disk Space (before sync)
        run: df -h

      - name: Initialize Minimal Manifest
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

      - name: Trim unneeded projects from manifest
        run: |
          cd workspace
          mkdir -p .repo/local_manifests

          # IMPORTANT: don't hand-parse .repo/manifests/default.xml with
          # ElementTree — minimal/AOSP manifests split into multiple files
          # stitched together with <include name="..."/> tags, and raw
          # ElementTree does NOT resolve includes. That mismatch is what
          # caused "remove-project element specifies non-existent project"
          # even for paths that genuinely exist in the manifest: our old
          # script was looking at an incomplete, unresolved view while
          # `repo sync` validates remove-project against the fully
          # resolved manifest.
          #
          # Fix: ask repo itself to dump the fully-resolved manifest, and
          # parse THAT instead. This guarantees we're looking at the same
          # set of projects that repo sync will validate against.
          repo manifest -o /tmp/resolved_manifest.xml

          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET

          # Paths we don't need for building TWRP on a Unisoc-based phone:
          # other vendors' full device+kernel trees, Qualcomm HALs,
          # Darwin host toolchains, unused kernel prebuilt versions,
          # and Android Automotive apps.
          paths_to_remove = [
              "device/google/atv", "device/google/barbet", "device/google/barbet-kernel",
              "device/google/barbet-sepolicy", "device/google/bonito", "device/google/bonito-kernel",
              "device/google/bonito-sepolicy", "device/google/bramble", "device/google/bramble-sepolicy",
              "device/google/coral", "device/google/coral-kernel", "device/google/coral-sepolicy",
              "device/google/gs101", "device/google/gs101-sepolicy", "device/google/gs-common",
              "device/google/raviole", "device/google/raviole-kernel", "device/google/redbull",
              "device/google/redbull-kernel", "device/google/redbull-sepolicy", "device/google/redfin",
              "device/google/redfin-sepolicy", "device/google/sunfish", "device/google/sunfish-kernel",
              "device/google/sunfish-sepolicy", "device/google/crosshatch", "device/google/crosshatch-kernel",
              "device/google/crosshatch-sepolicy", "device/google/cuttlefish", "device/google/cuttlefish_prebuilts",
              "device/google/trout", "device/google_car", "device/linaro/dragonboard",
              "device/linaro/dragonboard-kernel", "device/linaro/hikey", "device/linaro/hikey-kernel",
              "device/linaro/poplar", "device/linaro/poplar-kernel", "device/ti/beagle_x15",
              "device/ti/beagle_x15-kernel", "device/amlogic/yukawa", "device/amlogic/yukawa-kernel",
              "device/mediatek/wembley-sepolicy",
              "hardware/qcom/audio", "hardware/qcom/bootctrl", "hardware/qcom/bt", "hardware/qcom/camera",
              "hardware/qcom/data/ipacfg-mgr", "hardware/qcom/display", "hardware/qcom/gps",
              "hardware/qcom/keymaster", "hardware/qcom/media", "hardware/qcom/msm8960",
              "hardware/qcom/msm8994", "hardware/qcom/msm8996", "hardware/qcom/msm8x09",
              "hardware/qcom/msm8x26", "hardware/qcom/msm8x27", "hardware/qcom/msm8x84",
              "hardware/qcom/power", "hardware/qcom/sdm845/bt", "hardware/qcom/sdm845/data/ipacfg-mgr",
              "hardware/qcom/sdm845/display", "hardware/qcom/sdm845/gps", "hardware/qcom/sdm845/media",
              "hardware/qcom/sdm845/thermal", "hardware/qcom/sdm845/vr", "hardware/qcom/sm7150/gps",
              "hardware/qcom/sm7250/display", "hardware/qcom/sm7250/gps", "hardware/qcom/sm7250/media",
              "hardware/qcom/sm8150/data/ipacfg-mgr", "hardware/qcom/sm8150/display", "hardware/qcom/sm8150/gps",
              "hardware/qcom/sm8150/media", "hardware/qcom/sm8150/thermal", "hardware/qcom/sm8150/vr",
              "hardware/qcom/sm8150p/gps", "hardware/qcom/wlan",
              "prebuilts/bazel/darwin-x86_64", "prebuilts/clang/host/darwin-x86",
              "prebuilts/gcc/darwin-x86/aarch64/aarch64-linux-android-4.9",
              "prebuilts/gcc/darwin-x86/arm/arm-linux-androideabi-4.9",
              "prebuilts/gcc/darwin-x86/host/i686-apple-darwin-4.2.1",
              "prebuilts/gcc/darwin-x86/x86/x86_64-linux-android-4.9",
              "prebuilts/gdb/darwin-x86", "prebuilts/go/darwin-x86", "prebuilts/python/darwin-x86/2.7.5",
              "kernel/prebuilts/4.19/arm64", "kernel/prebuilts/5.4/arm64", "kernel/prebuilts/5.4/x86_64",
              "kernel/prebuilts/5.10/arm64", "kernel/prebuilts/5.10/x86_64", "kernel/prebuilts/mainline/arm64",
              "kernel/prebuilts/common-modules/virtual-device/4.19/arm64",
              "kernel/prebuilts/common-modules/virtual-device/4.19/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/5.10/arm64",
              "kernel/prebuilts/common-modules/virtual-device/5.10/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/5.4/arm64",
              "kernel/prebuilts/common-modules/virtual-device/5.4/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/mainline/arm64",
              "kernel/prebuilts/common-modules/virtual-device/mainline/x86-64",
              "packages/apps/Car/Calendar", "packages/apps/Car/SystemUI", "packages/apps/Car/Cluster",
              "packages/apps/Car/DebuggingRestrictionController", "packages/apps/Car/Dialer",
              "packages/apps/Car/Hvac", "packages/apps/Car/LatinIME", "packages/apps/Car/Launcher",
              "packages/apps/Car/LinkViewer", "packages/apps/Car/LocalMediaPlayer", "packages/apps/Car/Media",
              "packages/apps/Car/Messenger", "packages/apps/Car/Notification", "packages/apps/Car/Provision",
              "packages/apps/Car/Radio", "packages/apps/Car/RotaryController", "packages/apps/Car/Settings",
              "packages/apps/Car/SettingsIntelligence", "packages/apps/Car/SystemUpdater",
              "packages/apps/Car/libs", "packages/apps/Car/tests", "packages/services/Car",
          ]

          tree = ET.parse('/tmp/resolved_manifest.xml')
          root = tree.getroot()
          path_to_name = {}
          for project in root.findall('project'):
              n = project.get('name')
              # path is optional in repo manifests — when omitted it
              # defaults to the value of name. Fall back accordingly so
              # we don't silently drop entries that rely on that default.
              p = project.get('path') or n
              if p and n:
                  path_to_name[p] = n

          out = ET.Element('manifest')
          found, missing = 0, []
          for path in paths_to_remove:
              name = path_to_name.get(path)
              if name:
                  ET.SubElement(out, 'remove-project', {'name': name})
                  found += 1
              else:
                  missing.append(path)

          ET.ElementTree(out).write('.repo/local_manifests/remove_unused.xml',
                                     encoding='UTF-8', xml_declaration=True)

          print(f"Removing {found} projects from sync.")
          if missing:
              print(f"Note: {len(missing)} paths not found in resolved manifest (already absent or renamed): {missing}")
          PYEOF
          echo "--- Generated local manifest ---"
          cat .repo/local_manifests/remove_unused.xml
          echo "--- repo tool version ---"
          repo --version
          echo "--- Raw line for device/google/atv in resolved manifest ---"
          grep -n 'device/google/atv' /tmp/resolved_manifest.xml || echo "(not found in resolved manifest)"

      - name: Sync source
        run: |
          cd workspace
          # --depth=1 is the big one: without it, repo sync fetches full
          # git history for every one of the 400+ remaining projects,
          # which is typically 3-10x the size of a shallow checkout.
          # repo init --depth=1 earlier only shallow-clones the manifest
          # repo itself, not the projects it lists -- that has to be
          # passed to repo sync separately. History isn't needed to
          # build, only to `git log`/`git blame`, so this is safe here.
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync --depth=1 -j$(nproc)
          mkdir -p device/blu
          cp -r "$GITHUB_WORKSPACE/device-tree" device/blu/G0771

      - name: Check Disk Space (after sync)
        run: df -h

      - name: Clean up unneeded source before build
        run: |
          cd workspace
          rm -rf .repo/project-objects
          df -h

      - name: Compile Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_G0771-eng
          mka -j2 recoveryimage

      - name: Check Disk Space (after build)
        if: always()
        run: df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-blu-G0771
          path: workspace/out/target/product/G0771/recovery.img
